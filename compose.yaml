services:
  postgres:
    image: 'postgres:latest'
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=springapidb'
      - 'POSTGRES_PASSWORD=templateapi'
      - 'POSTGRES_USER=stanley'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgres/data
volumes:
  pgdata:
